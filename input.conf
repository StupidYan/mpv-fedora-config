# Playback
MBTN_RIGHT script-binding uosc/menu #! 菜单
MBTN_LEFT_DBL cycle fullscreen #! 视频 > 全屏
SPACE cycle pause #! 播放 > 暂停/继续
q quit #! 退出
Q quit-watch-later #! 退出 > 记住位置

# Danmaku
Ctrl+d script-message open_search_danmaku_menu #! 弹幕 > 搜索并加载
j script-message show_danmaku_keyboard #! 弹幕 > 开/关
# script-message open_add_total_menu #! 弹幕 > 设置菜单

# MediaInfo
F4 script-message uosc-menu-mediainfo #! 工具 > MediaInfo 菜单
Alt+i script-binding stats_mediainfo/display_toggle #! 工具 > MediaInfo 常驻面板

