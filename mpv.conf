# Fedora 44 clean baseline
vo=gpu-next
gpu-api=vulkan
gpu-context=auto

ao=pipewire
audio-device=auto

# AMD Radeon 680M. Copy mode is predictable with subtitles and filters.
hwdec=vaapi-copy
hwdec-codecs=h264,hevc,vp8,vp9,av1

# Official uosc recommendations.
osd-bar=no
border=no

# Subtitles and bundled uosc fonts.
sub-auto=fuzzy
sub-font-provider=fontconfig
sub-fonts-dir=~~/fonts

# Practical playback defaults.
keep-open=yes
save-position-on-quit=yes
screenshot-template=mpv-shot-%P-%n

# Online streams. Exclude yt-dlp danmaku pseudo-subtitle.
ytdl=yes
ytdl-raw-options-append=sub-langs=-danmaku
